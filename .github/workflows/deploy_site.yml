name: Deploy DB Migrations and Site

on:
  push:
    branches: [main]

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: 1/8 | Checkout repo
        uses: actions/checkout@v7
      - name: 2/8 | Setup Node environment
        uses: actions/setup-node@v7
        with:
          node-version: latest
      - name: 3/8 | Install dependencies
        run: npm ci --ignore-scripts
      - name: 4/8 | Install matching PostgreSQL client
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
      - name: 5/8 | Backup database
        run: /usr/lib/postgresql/17/bin/pg_dump "${{ secrets.MIGRATIONS_URL }}" -F c -f backup.dump
      - name: 6/8 | Run migrations
        id: migrate
        run: npm run db:migrate:prod
        env:
          DATABASE_URL: ${{ secrets.MIGRATIONS_URL }}
      - name: 7/8 | Restore backup on failure
        if: failure() && steps.migrate.outcome == 'failure'
        run: /usr/lib/postgresql/17/bin/pg_restore --clean --if-exists -d "${{ secrets.MIGRATIONS_URL }}" backup.dump
      - name: 8/8 | Upload backup artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: db-backup-${{ github.sha }}
          path: backup.dump

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify build
        run: curl -sf -X POST -d '{}' "${{ secrets.NETLIFY_BUILD_HOOK }}"